<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
</nav>

<div class="container">
    <div id="loginbox" style="margin-top:50px;" class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
        <form action="#" th:action="@{/contacto}" method="POST" th:object="${contactoDto}">
            <h3 class="form-signin-heading">Nuevo Usuario</h3>
            <hr class="colorgraph">
            <br>

            <input th:field="*{nombre}" id="nombre" type="text" name="nombre" class="form-control" required/>
            <input th:field="*{email}" type="email" id="email" name="email" class="form-control" required/>
            <textarea th:field="*{mensajeContacto}" id="mensajeContacto" name="msjContacto" rows="4" cols="50">
            </textarea>

            <button id="btn-registrarme" class="btn btn-lg btn-primary btn-block" Type="Submit">Enviar</button>
            <p th:if="${error != null}" class="alert alert-danger" th:text="'Error ' + ${error}">
            </p>
        </form>

    </div>
</div>
<script type="text/javascript" th:src="@{webjars/bootstrap/5.2.0/js/bootstrap.min.js}"></script>

</body>
</html>
